<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gusano Interactivo Monocromático</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; cursor: default; }
        #btn-inicio { padding: 18px 45px; font-size: 1.6rem; color: #000000; background: #ffffff; border: 2px solid #ffffff; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 25px rgba(255, 255, 255, 0.4); z-index: 10; }
        #btn-inicio:hover { background-color: #000000; color: #ffffff; border-color: #ffffff; box-shadow: 0 0 35px rgba(255, 255, 255, 0.8); transform: scale(1.08); }
        .controles { display: none; position: fixed; top: 25px; right: 25px; gap: 12px; z-index: 20; }
        .btn-control { padding: 10px 22px; font-size: 0.95rem; color: #ffffff; background: rgba(0, 0, 0, 0.8); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 30px; backdrop-filter: blur(5px); cursor: pointer; transition: all 0.3s ease; }
        .btn-control:hover { background: #ffffff; color: #000000; transform: scale(1.05); }
        #canvas-container { display: none; position: absolute; width: 100%; height: 100%; justify-content: center; align-items: center; cursor: crosshair; }
        canvas { display: block; }
    </style>
</head>
<body>
    <audio id="miMusica" src="musica5.mp3" preload="auto" loop></audio>
    <button id="btn-inicio">Inicio</button>
    <div class="controles" id="panel-controles">
        <button class="btn-control" id="btn-audio">🔊 Sonido: ON</button>
        <button class="btn-control" id="btn-salir">Salir</button>
    </div>
    <div id="canvas-container">
        <canvas id="gusanoCanvas"></canvas>
    </div>
    <script>
        const btnInicio = document.getElementById('btn-inicio');
        const btnSalir = document.getElementById('btn-salir');
        const btnAudio = document.getElementById('btn-audio');
        const panelControles = document.getElementById('panel-controles');
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('gusanoCanvas');
        const ctx = canvas.getContext('2d');
        const audioElement = document.getElementById('miMusica');

        let animacionId = null;
        let activo = false;
        let puntosGusano = [];
        const numSegmentos = 35;
        let mouseX = -1000;
        let mouseY = -1000;
        let cabezaX = 0;
        let cabezaY = 0;

        function ajustarCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', ajustarCanvas);

        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        window.addEventListener('touchmove', (e) => { if (e.touches.length > 0) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; } });

        function inicializarGusano() {
            puntosGusano = [];
            cabezaX = canvas.width / 2;
            cabezaY = canvas.height / 2;
            for (let i = 0; i < numSegmentos; i++) {
                puntosGusano.push({ x: cabezaX, y: cabezaY + (i * 12), radio: Math.max(5, 22 - (i * 0.4)) });
            }
        }

        btnAudio.addEventListener('click', () => {
            audioElement.muted = !audioElement.muted;
            btnAudio.textContent = audioElement.muted ? "🔇 Sonido: OFF" : "🔊 Sonido: ON";
        });

        btnInicio.addEventListener('click', () => {
            btnInicio.style.display = 'none';
            panelControles.style.display = 'flex';
            canvasContainer.style.display = 'block';
            ajustarCanvas();
            inicializarGusano();
            activo = true;

            audioElement.currentTime = 0;
            audioElement.muted = false;
            btnAudio.textContent = "🔊 Sonido: ON";
            audioElement.play().catch(err => console.log(err));

            iniciarAnimacion();
        });

        btnSalir.addEventListener('click', () => {
            activo = false;
            if (animacionId) cancelAnimationFrame(animacionId);

            audioElement.pause();
            audioElement.currentTime = 0;

            canvasContainer.style.display = 'none';
            panelControles.style.display = 'none';
            btnInicio.style.display = 'block';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        function iniciarAnimacion() {
            if (!activo) return;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let tiempo = Date.now() * 0.002;
            let objetivoX = (canvas.width / 2) + Math.cos(tiempo * 0.7) * (canvas.width * 0.35);
            let objetivoY = (canvas.height / 2) + Math.sin(tiempo * 0.5) * (canvas.height * 0.35);

            cabezaX += (objetivoX - cabezaX) * 0.05;
            cabezaY += (objetivoY - cabezaY) * 0.05;
            puntosGusano[0].x = cabezaX;
            puntosGusano[0].y = cabezaY;

            for (let i = 1; i < puntosGusano.length; i++) {
                let actual = puntosGusano[i];
                let previo = puntosGusano[i - 1];
                let dx = previo.x - actual.x;
                let dy = previo.y - actual.y;
                let distancia = Math.hypot(dx, dy);
                let separacionDeseada = 14;

                if (distancia > separacionDeseada) {
                    let angulo = Math.atan2(dy, dx);
                    actual.x = previo.x - Math.cos(angulo) * separacionDeseada;
                    actual.y = previo.y - Math.sin(angulo) * separacionDeseada;
                }

                let distanciaMouse = Math.hypot(mouseX - actual.x, mouseY - actual.y);
                let radioInteraccion = 120;
                if (distanciaMouse < radioInteraccion) {
                    let anguloMouse = Math.atan2(actual.y - mouseY, actual.x - mouseX);
                    let fuerzaEmpuje = (1 - (distanciaMouse / radioInteraccion)) * 30;
                    actual.x += Math.cos(anguloMouse) * fuerzaEmpuje;
                    actual.y += Math.sin(anguloMouse) * fuerzaEmpuje;
                }
            }

            for (let i = puntosGusano.length - 1; i >= 0; i--) {
                let p = puntosGusano[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radio, 0, Math.PI * 2);
                ctx.fillStyle = (i % 2 === 0) ? '#ffffff' : '#aaaaaa';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffffff';
                ctx.fill();
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            let cabeza = puntosGusano[0];
            ctx.beginPath();
            ctx.arc(cabeza.x - 4, cabeza.y - 3, 2.5, 0, Math.PI * 2);
            ctx.arc(cabeza.x + 4, cabeza.y - 3, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.shadowBlur = 0;
            ctx.fill();

            animacionId = requestAnimationFrame(iniciarAnimacion);
        }
    </script>
</body>
</html>
